<!-- chat + back to top -->
    <div class="chatbot-container">
        <button class="chatbot-launcher" onclick="window.toggleBodhiChat(event)" aria-label="Toggle Bodhi Support Chat">
            <svg class="chat-bubble-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 2H4C2.9 2 2 2.9 2 4V18C2 19.1 2.9 20 4 20H18L22 24V4C22 2.9 21.1 2 20 2Z" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="6" y1="7" x2="16" y2="7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="6" y1="11" x2="16" y2="11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="6" y1="15" x2="11" y2="15" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <svg class="chat-close-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <div class="chatbot-tooltip">
            Namaste!<br><span style="color:var(--muted); font-size:0.85rem;">How can we help you?</span>
        </div>

        <div class="chatbot-window">
            <div class="chatbot-header">
                <div class="chatbot-header-left">
                    <div class="chatbot-avatar">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M12 2C6.5 2 2 6.5 2 12C2 17.5 6.5 22 12 22C17.5 22 22 17.5 22 12C22 6.5 17.5 2 12 2ZM12 4C16.4 4 20 7.6 20 12C20 16.4 16.4 20 12 20C7.6 20 4 16.4 4 12C4 7.6 7.6 4 12 4Z" fill="none"/>
                            <path d="M12 7C9.5 9.5 8 13 8 16C11 16 14.5 14.5 17 12C14.5 9.5 12 7 12 7Z" fill="#ffffff"/>
                        </svg>
                    </div>
                    <div class="chatbot-header-info">
                        <h4>Bodhi Support</h4>
                        <div class="online-status">
                            <span class="online-dot"></span>
                            <span>Online</span>
                        </div>
                    </div>
                </div>
                <div class="chatbot-header-actions">
                    <button type="button" class="chatbot-action-btn" onclick="window.closeBodhiChat(event)" title="Close Chat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="chatbot-messages">
                <div class="chat-date-badge">Today at 10:42 AM</div>

                <div class="chat-msg bot">
                    <div class="msg-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 11.6a8.2 8.2 0 0 1-8.8 8.2L4 21l1.2-3.4a8.2 8.2 0 1 1 15.6-6z"/><path d="M8.6 10.8h6.8M8.6 14h4"/></svg></div>
                    <div class="msg-bubble">
                        Hi there. How can we help you with your digital transformation today?
                    </div>
                </div>
            </div>

            <div class="chatbot-suggestions">
                <button type="button" class="prompt-chip" data-prompt="Tell me more about your custom software process.">Custom Software</button>
                <button type="button" class="prompt-chip" data-prompt="What digital marketing services do you provide?">Digital Marketing</button>
                <button type="button" class="prompt-chip" data-prompt="How do you build custom websites?">Website Development</button>
                <button type="button" class="prompt-chip" data-prompt="Tell me about your 4-step approach">Our Approach</button>
                <button type="button" class="prompt-chip" data-prompt="How can I book a free consultation?">Book Consultation</button>
            </div>

            <div class="chatbot-footer">
                <form id="chatbotForm">
                    <div class="chatbot-input-wrap">
                        <button type="button" class="chat-attach-btn" title="Attach file">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                            </svg>
                        </button>
                        <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off" required>
                        <button type="submit" class="chat-send-btn" aria-label="Send message">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </form>
                <div class="chatbot-powered-by">Powered by Bodhi Tech AI</div>
            </div>
        </div>
    </div>

    <button class="back-to-top" aria-label="Back to Top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
